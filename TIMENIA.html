<ul class="list">${T.map(t=>`<li class="t s${t.s} ${t.id===nw?'new':''}"><input class="ti" data-id="${t.id}" value="${esc(t.t)}"><input class="tt" type="time" data-id="${t.id}" value="${t.tm||''}"><button class="pr p${P(t)}" data-a="pri" data-id="${t.id}">${PN[P(t)]}</button><button class="ic sm ok ${t.s==1?'on':''}" data-a="tk" data-id="${t.id}" data-v="1">${ic('check')}</button><button class="ic sm no ${t.s==2?'on':''}" data-a="tk" data-id="${t.id}" data-v="2">${ic('x')}</button><button class="ic sm" data-a="dt" data-id="${t.id}">${ic('trash')}</button></li>`).join('')||'<li class="t mu">Nothing planned. Add your first task above.</li>'}</ul>${T.some(t=>t.s!=1)?'<button class="btn" style="margin-top:6px" data-a="mv">Move unfinished to next day</button>':''}</section>`};
const TT={syl:'Syllabus',plan:'Planner',ins:'Insights'};
function render(){lab();$('#hl').innerHTML=view=='home'?'<span class="logo">TIMENIA</span>':`<button class="ic" data-a="nav" data-v="home">${ic('back')}</button><span class="ttl">${TT[view]}</span>`;const m=$('#main');m.innerHTML={home:home2,syl,plan:planner,ins}[view]();nw='';if(anim){m.classList.remove('in');void m.offsetWidth;m.classList.add('in');anim=false}tick()}
function modal(h){$('#mc').innerHTML=h;$('#modal').classList.add('open')}
const val=s=>$(s).value.trim();
function applyMin(){if(!ed)return;const v=Math.max(1,Math.min(300,+$('#min').value||S.min));ed=false;S.min=v;run=false;rem=v*60;save();tick()}
document.addEventListener('click',e=>{const mn=$('#menu');if(mn.classList.contains('open')&&!e.target.closest('#menu')&&!e.target.closest('#mb'))mn.classList.remove('open');
const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id,sb=S.subs.find(x=>x.id==id);let f='',soft=0;if(lk&&run&&['go','reset','adj','edit','close','lock'].includes(a))return;
switch(a){
case'menu':mn.classList.toggle('open');return;
case'nav':view=v;anim=true;mn.classList.remove('open');break;
case'open':{$('#tsub').innerHTML='<option value="">No subject</option>'+S.subs.map(s=>`<option value="${s.id}" ${s.id===tsub?'selected':''}>${esc(s.n)}</option>`).join('');$('#ov').classList.add('open');soft=1;break}
case'close':$('#ov').classList.remove('open');applyMin();break;
case'go':if(ed)applyMin();run=!run;snd(run?660:440,.25,'triangle',.06);soft=1;break;
case'reset':run=false;rem=S.min*60;soft=1;break;
case'adj':S.min=Math.max(1,Math.min(300,S.min+ +v));run=false;rem=S.min*60;soft=1;break;
case'edit':if(run||ed)return;ed=true;$('#tm').innerHTML=`<input id="min" type="number" min="1" max="300" value="${S.min}">`;$('#min').focus();$('#min').select();return;
case'tth':S.ath=+v;applyTheme();lab();soft=1;break;
case'lock':if(run)return;lk=!lk;snd(lk?300:500,.12);soft=1;break;
case'xit':clearTimeout(xtm);xt++;if(xt>=11){xt=0;run=false;lk=false;rem=S.min*60;snd(300)}else xtm=setTimeout(()=>{xt=0;tick()},3000);soft=1;break;
case'pd':sel=v;break;
case'tdy':sel=dk();po=0;break;
case'addp':{const t=val('#pt');if(t){nw=uid();S.tasks.push({id:nw,d:sel,t,s:0,tm:$('#ptm').value,p:1})}f='#pt';break}
case'addh':{const t=val('#nt');if(t){nw=uid();S.tasks.push({id:nw,d:dk(),t,s:0,p:1})}f='#nt';break}
case'pri':{const x=S.tasks.find(y=>y.id==id);x.p=(P(x)+1)%3;break}
case'mv':{const d=D(sel);d.setDate(d.getDate()+1);S.tasks.forEach(t=>{if(t.d===sel&&t.s!=1)t.d=dk(d)});break}
case'ath':mn.classList.remove('open');modal('<h3>Theme</h3><div class="thg">'+SC.map((t,i)=>`<button class="tl ${i==S.ath?'on':''}" data-a="sth" data-v="${i}">${t[0]}</button>`).join('')+'</div>');return;
case'sth':S.ath=+v;applyTheme();lab();$('#modal').classList.remove('open');soft=1;break;
case'snd':S.snd=!S.snd;lab();snd(600,.1);soft=1;break;
case'gd':{const i=b.previousElementSibling,k=i.dataset.k,g=S.goals[k]||(S.goals[k]={t:'',s:0});g.t=i.value.trim();if(!g.t)return;g.s=g.s?0:1;snd(g.s?880:440,.18);break}
case'exam':mn.classList.remove('open');modal(`<h3>Exam countdown</h3><input id="en" placeholder="Exam name" value="${esc(S.exam.n)}"><div class="row"><input id="ed" type="date" value="${S.exam.d}"></div><div class="row sp"><button class="btn" data-a="mclose">Cancel</button><button class="btn pri" data-a="esave">Save</button></div>`);return;
case'esave':S.exam={n:val('#en'),d:$('#ed').value};$('#modal').classList.remove('open');break;
case'wipe':mn.classList.remove('open');modal(`<h3>Reset all data?</h3><p class="mu">Tasks, syllabus, study logs and exam date will be erased.</p><div class="row sp"><button class="btn" data-a="mclose">Cancel</button><button class="btn pri" data-a="wok">Erase</button></div>`);return;
case'wok':S=def();run=false;rem=S.min*60;$('#modal').classList.remove('open');break;
case'mclose':if(b.classList.contains('mw')&&e.target!==b)return;$('#modal').classList.remove('open');return;
case'day':{const d=D(sel);d.setDate(d.getDate()+ +v);sel=dk(d);{const n=new Date();po=(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth()}break}
case'addt':{const t=val('#nt');if(t){nw=uid();S.tasks.push({id:nw,d:sel,t,s:0})}f='#nt';break}
case'tk':{const t=S.tasks.find(x=>x.id==id);t.s=t.s==+v?0:+v;pop(t.s==1?300:t.s==2?150:220);break}
case'dt':S.tasks=S.tasks.filter(x=>x.id!=id);break;
case'adds':{const n=val('#ns');if(n){nw=uid();S.subs.push({id:nw,n,ch:[]})}f='#ns';break}
case'dsub':S.subs=S.subs.filter(x=>x.id!=id);break;
case'addc':{const n=b.previousElementSibling.value.trim();if(n){nw=uid();sb.ch.push({id:nw,n,s:0})}break}
case'cyc':{const c=sb.ch.find(x=>x.id==b.dataset.c);c.s=(c.s+1)%3;break}
case'dch':sb.ch=sb.ch.filter(x=>x.id!=b.dataset.c);break;
case'pv':pv=v;po=0;break;case'po':po+=+v;break;case'gv':gv=v;break;
case'pick':sel=v;view='home';anim=true;break}
save();soft?tick():render();if(f)$(f).focus()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){if(e.target.matches('#nt,#ns,.nc'))e.target.nextElementSibling.click();if(e.target.classList.contains('ti'))e.target.blur();if(e.target.id=='pt')$('[data-a=addp]').click();if(e.target.id=='min')applyMin()}if(e.key=='Escape'){if(!(lk&&run))$('#ov').classList.remove('open');$('#modal').classList.remove('open');$('#menu').classList.remove('open')}});
document.addEventListener('focusout',e=>{if(e.target.id=='min')applyMin()});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='tsub')tsub=t.value;if(t.classList.contains('ti')||t.classList.contains('tt')){const x=S.tasks.find(y=>y.id==t.dataset.id);if(x){if(t.classList.contains('ti')){x.t=t.value.trim()||x.t;t.value=x.t}else x.tm=t.value;save()}}});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;pop();const r=b.getBoundingClientRect(),s=document.createElement('span'),z=Math.max(r.width,r.height)*2;s.className='r';s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)});
let gq=0,gx=0,gy=0;addEventListener('pointermove',e=>{gx=e.clientX;gy=e.clientY;const c=$('#cg');c.style.opacity=1;if(!gq)gq=requestAnimationFrame(()=>{gq=0;c.style.transform=`translate(${gx}px,${gy}px)`});const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')}});
document.addEventListener('mouseleave',()=>{$('#cg').style.opacity=0});
addEventListener('beforeunload',e=>{if(lk&&run){e.preventDefault();e.returnValue=''}});
applyTheme();render();
</script></body></html>
